<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front End - HTML - 04 Media</title>

    <link rel="stylesheet" href="../css/general.css">
</head>
<body>

    <div class="wrapper">

        <h1>Media</h1>

        <!-- Incorporare video -->
        <video src="media/hippo.mp4" width="600" controls autoplay muted loop>
            <source src="media/hippo.webm" type="video/webm">
            <source src="media/hippo.ogg" type="video/ogg">
            Il tuo browser fa schifo e non supporta il tag video
        </video>

        <!-- Incorporare audio -->
        <audio src="media/audio.mp3" controls autoplay muted loop>
            <source src="media/audio.ogg" type="audio/ogg">
            Il tuo browser non supporta manco l'audio
        </audio>

        <!-- Incorporare contenuti esterni (altra pagina web, mappa, video YT) -->
        <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?si=6-x3voAl6qb4K6hm" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2817.9883966717002!2d7.681586076686727!3d45.0657464599355!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47886d6c24c94fcd%3A0x1745e2aae993e367!2sImmaginazione%20e%20Lavoro!5e0!3m2!1sit!2sit!4v1794386178035!5m2!1sit!2sit" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        
    </div>
    
</body>
</html>
